<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:#171310;color:#ece5d8;}
#view-home,#view-game{min-height:100vh;}
/* 顶部条（所有视图共用） */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:12px;padding:0 20px;height:54px;background:rgba(20,17,14,.96);border-bottom:1px solid #3a3228;backdrop-filter:blur(6px);}
#topbar .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:#f5d98a;letter-spacing:.5px;white-space:nowrap;}
#topbar .logo svg{flex:none;}
#topbar .nav{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
#topbar .nav a{color:#a89a88;padding:7px 13px;border-radius:7px;font-size:14px;text-decoration:none;white-space:nowrap;cursor:pointer;}
#topbar .nav a:hover{color:#fff;background:#241f18;}
#topbar .nav a.on{color:#f5d98a;background:#241f18;font-weight:700;}
/* 首页 */
#view-home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 20px 60px;min-height:100vh;background:radial-gradient(900px 500px at 15% -10%, rgba(74,124,89,.14) 0%, transparent 55%),radial-gradient(900px 500px at 85% 110%, rgba(232,184,75,.10) 0%, transparent 55%),linear-gradient(180deg,#171310 0%, #0e0c09 100%);}
#view-home h1{font-size:clamp(28px,5vw,46px);font-weight:900;color:#fff;margin:20px 0 12px;letter-spacing:1px;}
#view-home h1 .st{color:#6B9E7A;}#view-home h1 .te{color:#f5d98a;}
#view-home .sub{color:#a89a88;max-width:540px;font-size:15px;}
#view-home .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px;max-width:860px;width:100%;}
@media(max-width:680px){#view-home .cards{grid-template-columns:1fr;}}
.cards .card{display:flex;flex-direction:column;align-items:flex-start;background:#1c1813;border:1px solid #3a3228;border-radius:16px;padding:28px 24px;text-align:left;cursor:pointer;transition:transform .18s,border-color .18s;position:relative;overflow:hidden;}
.cards .card:hover{transform:translateY(-4px);border-color:#e8b84b;}
.cards .card svg{width:44px;height:44px;margin-bottom:14px;}
.cards .card h2{font-size:22px;color:#fff;margin-bottom:2px;}
.cards .card .en{font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.cards .card.sv .en{color:#6B9E7A;}.cards .card.te .en{color:#f5d98a;}
.cards .card p{color:#a89a88;font-size:14px;line-height:1.6;}
.cards .card .go{margin-top:18px;padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;color:#14100b;}
.cards .card.sv .go{background:linear-gradient(90deg,#6B9E7A,#4A7C59);}
.cards .card.te .go{background:linear-gradient(90deg,#f5d98a,#e8b84b);}
/* 游戏视图 iframe */
#view-game{display:none;padding-top:54px;}
#view-game iframe{width:100%;height:calc(100vh - 54px);border:0;display:block;}
</style>
</head>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星露谷物语攻略站 - 新手入门 · 作物图鉴 · Bug修复</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root {
  --bg: #F5EFE0;
  --bg-card: #FBF7EC;
  --green: #4A7C59;
  --green-dark: #3A6247;
  --green-light: #6B9E7A;
  --gold: #D4A843;
  --gold-dark: #B8912E;
  --brown: #8B6914;
  --text: #3D2B1F;
  --text-light: #6B5544;
  --border: #D9C9A3;
  --spring: #7CB342;
  --summer: #FF8F00;
  --fall: #D84315;
  --winter: #5C6BC0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(74,124,89,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(212,168,67,0.05) 0%, transparent 50%);
}

/* ===== 导航 ===== */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(245,239,224,0.95);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--border);
  padding: 0 24px;
}
.nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}
.nav-logo {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 20px;
  color: var(--green-dark);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-logo svg { width: 28px; height: 28px; }
.nav-links { display: flex; gap: 8px; list-style: none; }
.nav-links a {
  text-decoration: none;
  color: var(--text-light);
  font-size: 15px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 6px;
  transition: all 0.2s;
}
.nav-links a:hover {
  color: var(--green-dark);
  background: rgba(74,124,89,0.08);
}
.nav-links a.active {
  color: var(--green-dark);
  background: rgba(74,124,89,0.12);
  font-weight: 700;
}

/* ===== Hero ===== */
.hero {
  max-width: 1100px;
  margin: 0 auto;
  padding: 80px 24px 60px;
  text-align: center;
}
.hero-badge {
  display: inline-block;
  font-size: 13px;
  color: var(--brown);
  background: rgba(212,168,67,0.15);
  border: 1px solid rgba(212,168,67,0.3);
  padding: 4px 14px;
  border-radius: 20px;
  margin-bottom: 20px;
  letter-spacing: 1px;
}
.hero h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(36px, 6vw, 56px);
  font-weight: 900;
  color: var(--green-dark);
  line-height: 1.3;
  margin-bottom: 16px;
}
.hero h1 span { color: var(--gold-dark); }
.hero p {
  font-size: 18px;
  color: var(--text-light);
  max-width: 600px;
  margin: 0 auto 40px;
}
.hero-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 40px;
}
.hero-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 24px;
  text-align: left;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: block;
}
.hero-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(61,43,31,0.1);
}
.hero-card-icon {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.hero-card-icon svg { width: 26px; height: 26px; }
.hero-card h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}
.hero-card p {
  font-size: 14px;
  color: var(--text-light);
  margin: 0;
  line-height: 1.6;
}

/* ===== 通用板块 ===== */
.section {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 24px;
}
.section-header {
  margin-bottom: 40px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--border);
}
.section-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--gold-dark);
  font-weight: 700;
  letter-spacing: 2px;
}
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(28px, 4vw, 38px);
  font-weight: 900;
  color: var(--green-dark);
  margin-top: 4px;
}
.section-desc {
  color: var(--text-light);
  margin-top: 8px;
  font-size: 16px;
}

/* ===== 新手入门 ===== */
.guide-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.guide-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  position: relative;
  overflow: hidden;
}
.guide-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--green);
}
.guide-card h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--green-dark);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.guide-card h3 .step-num {
  background: var(--green);
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-family: 'Noto Sans SC', sans-serif;
  flex-shrink: 0;
}
.guide-card ul {
  list-style: none;
  padding: 0;
}
.guide-card li {
  padding: 6px 0 6px 20px;
  position: relative;
  font-size: 15px;
  color: var(--text);
}
.guide-card li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 14px;
  width: 8px;
  height: 8px;
  background: var(--gold);
  border-radius: 50%;
}
.guide-card li strong { color: var(--green-dark); }

.tip-box {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, rgba(212,168,67,0.1), rgba(74,124,89,0.08));
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 24px 28px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.tip-box svg { width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px; }
.tip-box-content h4 {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  color: var(--gold-dark);
  margin-bottom: 6px;
}
.tip-box-content p { font-size: 15px; color: var(--text); }

/* ===== 游戏介绍 ===== */
.intro-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px;
  margin-bottom: 32px;
}
.intro-box h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--green-dark);
  margin-bottom: 16px;
}
.intro-box p {
  font-size: 16px;
  line-height: 1.9;
  margin-bottom: 12px;
}
.intro-box p:last-child { margin-bottom: 0; }
.intro-box .highlight {
  background: rgba(212,168,67,0.15);
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
  color: var(--gold-dark);
}
.core-loop {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 20px;
}
.loop-item {
  background: rgba(74,124,89,0.06);
  border-radius: 8px;
  padding: 16px 12px;
  text-align: center;
}
.loop-item .loop-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 900;
  color: var(--green);
  display: block;
  margin-bottom: 4px;
}
.loop-item .loop-text {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
}

/* ===== 时间轴 ===== */
.timeline {
  position: relative;
  padding-left: 32px;
  margin: 24px 0;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--border);
}
.timeline-item {
  position: relative;
  padding-bottom: 24px;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-dot {
  position: absolute;
  left: -32px;
  top: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--green);
  border: 3px solid var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.timeline-dot span {
  font-size: 11px;
  font-weight: 700;
  color: #fff;
}
.timeline-day {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--green-dark);
  margin-bottom: 6px;
}
.timeline-content {
  font-size: 14px;
  color: var(--text);
  line-height: 1.7;
}
.timeline-content strong { color: var(--gold-dark); }

/* ===== 该做/不该做 ===== */
.dodont-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 24px 0;
}
.dodont-card {
  border-radius: 12px;
  padding: 24px;
}
.dodont-card.do {
  background: rgba(74,124,89,0.06);
  border: 1px solid rgba(74,124,89,0.2);
}
.dodont-card.dont {
  background: rgba(216,67,21,0.05);
  border: 1px solid rgba(216,67,21,0.2);
}
.dodont-card h4 {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dodont-card.do h4 { color: var(--green-dark); }
.dodont-card.dont h4 { color: var(--fall); }
.dodont-card ul { list-style: none; padding: 0; }
.dodont-card li {
  padding: 8px 0 8px 24px;
  position: relative;
  font-size: 14px;
  line-height: 1.6;
}
.dodont-card.do li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--green);
  font-weight: 700;
}
.dodont-card.dont li::before {
  content: '✗';
  position: absolute;
  left: 0;
  color: var(--fall);
  font-weight: 700;
}

/* ===== NPC速查 ===== */
.npc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 24px 0;
}
.npc-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
}
.npc-card .npc-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--green-dark);
  margin-bottom: 4px;
}
.npc-card .npc-role {
  font-size: 12px;
  color: var(--gold-dark);
  font-weight: 600;
  margin-bottom: 8px;
}
.npc-card .npc-desc {
  font-size: 13px;
  color: var(--text-light);
  line-height: 1.6;
}

/* ===== 快捷键 ===== */
.shortcut-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 20px 0;
}
.shortcut-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
}
.shortcut-key {
  background: var(--green-dark);
  color: #fff;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  min-width: 60px;
  text-align: center;
  flex-shrink: 0;
}
.shortcut-desc { font-size: 14px; color: var(--text); }

/* ===== 每季推荐 ===== */
.season-pick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.season-pick {
  border-radius: 12px;
  padding: 20px;
  color: #fff;
}
.season-pick.spring { background: linear-gradient(135deg, #7CB342, #558B2F); }
.season-pick.summer { background: linear-gradient(135deg, #FF8F00, #E65100); }
.season-pick.fall { background: linear-gradient(135deg, #D84315, #BF360C); }
.season-pick.winter { background: linear-gradient(135deg, #5C6BC0, #3949AB); }
.season-pick h4 {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 10px;
}
.season-pick .best-crop {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}
.season-pick .pick-desc {
  font-size: 12px;
  opacity: 0.9;
  line-height: 1.5;
}

/* ===== 自查清单 ===== */
.checklist {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  margin: 24px 0;
}
.checklist h4 {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--green-dark);
  margin-bottom: 16px;
}
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
  cursor: pointer;
  transition: opacity 0.2s;
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item.checked .check-text { text-decoration: line-through; color: var(--text-light); opacity: 0.6; }
.check-box {
  width: 22px;
  height: 22px;
  border: 2px solid var(--green);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
  transition: background 0.2s;
}
.checklist-item.checked .check-box {
  background: var(--green);
}
.check-box svg { width: 14px; height: 14px; color: #fff; opacity: 0; transition: opacity 0.2s; }
.checklist-item.checked .check-box svg { opacity: 1; }
.check-text { font-size: 15px; line-height: 1.6; }
.check-text strong { color: var(--green-dark); }

/* ===== 作物图鉴 ===== */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 8px 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  color: var(--text-light);
}
.filter-btn:hover { border-color: var(--green); color: var(--green-dark); }
.filter-btn.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.filter-btn.active.spring { background: var(--spring); border-color: var(--spring); }
.filter-btn.active.summer { background: var(--summer); border-color: var(--summer); }
.filter-btn.active.fall { background: var(--fall); border-color: var(--fall); }
.filter-btn.active.winter { background: var(--winter); border-color: var(--winter); }

.crop-table-wrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-card);
}
.crop-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 14px;
}
.crop-table thead {
  background: var(--green-dark);
  color: #fff;
}
.crop-table th {
  padding: 14px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.5px;
}
.crop-table td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.crop-table tbody tr:hover { background: rgba(74,124,89,0.04); }
.crop-table tbody tr:last-child td { border-bottom: none; }
.crop-name {
  font-weight: 700;
  color: var(--green-dark);
  font-size: 15px;
}
.season-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
}
.season-tag.spring { background: var(--spring); }
.season-tag.summer { background: var(--summer); }
.season-tag.fall { background: var(--fall); }
.season-tag.winter { background: var(--winter); }
.profit-high { color: var(--green-dark); font-weight: 700; }
.profit-mid { color: var(--gold-dark); font-weight: 600; }
.profit-low { color: var(--text-light); }
.crop-note { font-size: 12px; color: var(--text-light); line-height: 1.5; }

/* ===== Bug修复 ===== */
.bug-list { display: flex; flex-direction: column; gap: 16px; }
.bug-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.bug-question {
  padding: 20px 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  transition: background 0.2s;
}
.bug-question:hover { background: rgba(74,124,89,0.03); }
.bug-question h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}
.bug-severity {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.severity-low { background: rgba(74,124,89,0.15); color: var(--green-dark); }
.severity-mid { background: rgba(212,168,67,0.2); color: var(--gold-dark); }
.severity-high { background: rgba(216,67,21,0.15); color: var(--fall); }
.bug-toggle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(74,124,89,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.3s;
}
.bug-toggle svg { width: 16px; height: 16px; transition: transform 0.3s; }
.bug-item.open .bug-toggle svg { transform: rotate(180deg); }
.bug-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.bug-item.open .bug-answer { max-height: 500px; }
.bug-answer-inner {
  padding: 0 24px 24px;
  border-top: 1px solid var(--border);
  padding-top: 16px;
}
.bug-answer-inner p { font-size: 15px; margin-bottom: 10px; }
.bug-answer-inner p:last-child { margin-bottom: 0; }
.bug-answer-inner .fix-label {
  font-weight: 700;
  color: var(--green-dark);
}
.bug-answer-inner ol {
  padding-left: 20px;
  margin: 8px 0;
}
.bug-answer-inner li {
  margin-bottom: 6px;
  font-size: 14px;
}

/* ===== 页脚 ===== */
footer {
  border-top: 2px solid var(--border);
  padding: 40px 24px;
  text-align: center;
  margin-top: 40px;
}
footer p {
  color: var(--text-light);
  font-size: 14px;
  margin-bottom: 6px;
}
footer .disclaimer {
  font-size: 12px;
  color: #999;
  max-width: 600px;
  margin: 12px auto 0;
  line-height: 1.6;

/* ===== 回到顶部 ===== */
.back-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(74,124,89,0.3);

  visibility: hidden;
  transition: all 0.3s;
  z-index: 99;

.back-top.show { opacity: 1; visibility: visible; }
.back-top:hover { background: var(--green-dark); transform: translateY(-2px); }

<section class="section" id="beginner">
  <div class="section-header">
    <div class="section-num">CHAPTER 01</div>
    <h2 class="section-title">新手入门</h2>
    <p class="section-desc">从打开游戏到站稳脚跟，一步步带你走</p>
  </div>

  <!-- 30秒看懂 -->
  <div class="intro-box">
    <h3>30秒看懂：这个游戏到底在玩什么？</h3>
    <p>你继承了爷爷留下的一座破旧农场，从<strong>只有50块钱和一堆杂草</strong>开始，通过种地、钓鱼、挖矿、养动物、和村民交朋友，一步步把农场做大。游戏没有终点、没有失败，<span class="highlight">你想怎么玩就怎么玩</span>。</p>
    <p>每天的核心循环就四步：</p>
    <div class="core-loop">
      <div class="loop-item"><span class="loop-num">1</span><span class="loop-text">起床浇水<br>照顾作物</span></div>
      <div class="loop-item"><span class="loop-num">2</span><span class="loop-text">出门赚钱<br>钓鱼/挖矿</span></div>
      <div class="loop-item"><span class="loop-num">3</span><span class="loop-text">和村民聊天<br>提升好感</span></div>
      <div class="loop-item"><span class="loop-num">4</span><span class="loop-text">凌晨2点前<br>回家睡觉</span></div>
    </div>
    <p style="margin-top:16px;font-size:14px;color:var(--text-light)">记住：<strong>这游戏没有"正确玩法"</strong>。有人第一年就赚百万，有人每天只钓鱼聊天。按自己的节奏来，开心最重要。</p>
  </div>

  <!-- 第一周日程 -->
  <div class="intro-box">
    <h3>第一周每天干什么？照着做就行</h3>
    <div class="timeline">
      <div class="timeline-item">
        <div class="timeline-dot"><span>1</span></div>
        <div class="timeline-day">第1天 · 安顿下来</div>
        <div class="timeline-content">清理农场杂草 → 种下全部15个防风草种子并浇水 → 去小镇认识村民 → <strong>2点前睡觉</strong>。别想着赚钱，先熟悉操作和地图。</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"><span>2</span></div>
        <div class="timeline-day">第2天 · 开始钓鱼</div>
        <div class="timeline-content">早上浇水 → 去海边找<strong>威利</strong>拿鱼竿 → 在河边/海边练钓鱼 → 钓到的鱼先存着别卖（可以吃回体力）。</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"><span>3</span></div>
        <div class="timeline-day">第3天 · 采集+钓鱼</div>
        <div class="timeline-content">浇水 → 全地图跑一遍捡野货（韭葱、野山葵、黄水仙）→ 继续钓鱼升级 → 攒的钱先留着，<strong>别乱花</strong>。</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"><span>4</span></div>
        <div class="timeline-day">第4天 · 收第一波菜</div>
        <div class="timeline-content">防风草成熟了！收获卖掉 → 去皮埃尔商店买<strong>土豆种子</strong>（性价比高）继续种 → 下午钓鱼或采集。</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"><span>5</span></div>
        <div class="timeline-day">第5天 · 矿洞开放！</div>
        <div class="timeline-content">收到信件说矿洞开了 → 浇水后去矿洞<strong>敲石头挖铜矿</strong> → 下到5-10层就行，别贪深 → 铜矿很值钱。</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"><span>6</span></div>
        <div class="timeline-day">第6天 · 稳定节奏</div>
        <div class="timeline-content">浇水 → 挖矿或钓鱼二选一 → 记得和遇到的村民说话 → 检查钱够不够升级工具（<strong>水壶优先</strong>）。</div>
      </div>
      <div class="timeline-item">
        <div class="timeline-dot"><span>7</span></div>
        <div class="timeline-day">第7天 · 复盘+准备</div>
        <div class="timeline-content">整理背包和箱子 → 看看还差多少钱 → 为<strong>第13天复活节</strong>做准备（那天能买草莓种子，春天最赚钱的作物）。</div>
      </div>
    </div>
  </div>

  <div class="guide-grid">
    <div class="guide-card">
      <h3><span class="step-num">1</span>第一天怎么过</h3>
      <ul>
        <li><strong>先清理农场</strong>：用斧头砍树、镐子敲石头，收集木材和石头，至少攒够 50 木材。</li>
        <li><strong>种防风草</strong>：皮埃尔商店买的 15 个防风草种子当天必须种下，浇水后第二天开始生长。</li>
        <li><strong>认识村民</strong>：向右走到小镇，和遇到的每个 NPC 对话打招呼，提升初始好感。</li>
        <li><strong>别熬夜</strong>：凌晨 2 点前必须睡觉，否则会晕倒损失金钱和体力。</li>
        <li><strong>翻垃圾桶</strong>：小镇的垃圾桶每天可以翻一次，可能找到食物或材料。</li>
      </ul>
    </div>

    <div class="guide-card">
      <h3><span class="step-num">2</span>初期赚钱思路</h3>
      <ul>
        <li><strong>钓鱼是神技</strong>：春天去河边/海边钓鱼，鲶鱼和鲷鱼售价不错，钓鱼等级提升后收益更高。</li>
        <li><strong>采集野货</strong>：每天在地图上捡韭葱、野山葵、黄水仙等，春天的韭葱可以吃也可以卖。</li>
        <li><strong>下矿洞</strong>：第 5 天矿洞开放，敲石头得矿石和晶石，铜矿早期很值钱。</li>
        <li><strong>优先种防风草和土豆</strong>：土豆有概率一次结多个，性价比高；花椰菜生长慢但单价高。</li>
        <li><strong>攒钱买草莓种子</strong>：春 13 日复活节，草莓种子是春天最赚钱的作物，尽量多买。</li>
      </ul>
    </div>

    <div class="guide-card">
      <h3><span class="step-num">3</span>体力与时间管理</h3>
      <ul>
        <li><strong>体力分配</strong>：早上体力满时先做重活（挖矿、砍树），下午体力低时浇水、钓鱼。</li>
        <li><strong>吃食物回体力</</strong>：钓到的鱼、采集的野货都可以吃，别浪费钱买体力药。</li>
        <li><strong>时间观念</strong>：商店下午 5 点关门，医院下午 4 点，注意安排行程。</li>
        <li><strong>升级工具</strong>：攒钱先升级水壶（浇更多地）和镐子（挖更硬的矿），斧头其次。</li>
        <li><strong>建造鸡舍</strong>：第一个夏天前建好鸡舍，鸡蛋是稳定的被动收入。</li>
      </ul>
    </div>

    <div class="guide-card">
      <h3><span class="step-num">4</span>四季规划要点</h3>
      <ul>
        <li><strong>春天</strong>：种防风草+土豆攒钱，复活节抢草莓种子，开始钓鱼和下矿。</li>
        <li><strong>夏天</strong>：蓝莓是夏天之王（多次收获），同时种辣椒和啤酒花，开始养动物。</li>
        <li><strong>秋天</strong>：南瓜（单价高）和蔓越莓（多次收获）并行，攒钱准备温室。</li>
        <li><strong>冬天</strong>：不能种地，集中下矿、钓鱼、升级工具、和村民刷好感。</li>
        <li><strong>第一年目标</strong>：解锁温室、修好社区中心或完成 Joja 路线、建好畜棚。</li>
      </ul>
    </div>

    <div class="tip-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0012 2z"/></svg>
      <div class="tip-box-content">
        <h4>新手黄金建议</h4>
        <p>不要急着扩张！第一年先把地浇好、鱼钓好、矿挖好。很多新手一上来就种 100 颗作物，结果每天浇水浇到虚脱还赚不到钱。先小面积精耕，有了稳定收入再逐步扩大。另外，<strong>每周五和周日在猪车那里可以买到稀有种子和物品</strong>，记得去看看。</p>
      </div>
    </div>
  </div>

  <!-- 必做 vs 别踩坑 -->
  <div class="intro-box" style="margin-top:32px">
    <h3>新手必做 vs 千万别踩坑</h3>
    <div class="dodont-grid">
      <div class="dodont-card do">
        <h4>一定要做</h4>
        <ul>
          <li><strong>每天浇水</strong>：作物不浇水就不长，这是头等大事</li>
          <li><strong>每天和村民说话</strong>：好感度解锁剧情和配方，很重要</li>
          <li><strong>练钓鱼</strong>：初期最赚钱的方式没有之一</li>
          <li><strong>攒钱等复活节</strong>：春13日的草莓种子是春天印钞机</li>
          <li><strong>升级水壶</strong>：铜水壶能浇3x3，省一半时间</li>
          <li><strong>建箱子分类</strong>：东西乱扔后期会疯掉</li>
        </ul>
      </div>
      <div class="dodont-card dont">
        <h4>千万别做</h4>
        <ul>
          <li><strong>别熬夜到2点后</strong>：晕倒会扣钱，第二天还没体力</li>
          <li>别一开始就种<strong>100颗作物</strong>：浇不完还累垮</li>

<!-- ===== Bug修复 ===== -->
<section class="section" id="bugs">
  <div class="section-header">
    <div class="section-num">CHAPTER 03</div>
    <h2 class="section-title">Bug修复</h2>
    <p class="section-desc">常见问题与解决方案，点击展开查看详情</p>
  </div>

  <div class="bug-list">
    <div class="bug-item">
      <div class="bug-question" onclick="toggleBug(this)">
        <h3>游戏存档丢失或损坏怎么办？</h3>
        <span class="bug-severity severity-high">严重</span>
        <span class="bug-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="bug-answer">
        <div class="bug-answer-inner">
          <p><span class="fix-label">原因：</span>游戏崩溃、云同步冲突或手动删除可能导致存档损坏。</p>
          <p><span class="fix-label">解决方法：</span></p>
          <ol>
            <li>找到存档位置：Windows 在 <code>%AppData%\StardewValley\Saves</code>，Mac 在 <code>~/.config/StardewValley/Saves</code>。</li>
            <li>查看是否有 <code>_old</code> 后缀的备份文件，去掉后缀替换原文件即可恢复。</li>
            <li>如果开启了 Steam 云同步，右键游戏 → 属性 → 通用 → 关闭云同步，再从本地存档启动。</li>
            <li>定期手动备份 Saves 文件夹，这是最保险的做法。</li>
          </ol>
        </div>
      </div>
    </div>

    <div class="bug-item">
      <div class="bug-question" onclick="toggleBug(this)">
        <h3>游戏卡顿、掉帧严重</h3>
        <span class="bug-severity severity-mid">中等</span>
        <span class="bug-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="bug-answer">
        <div class="bug-answer-inner">
          <p><span class="fix-label">解决方法：</span></p>
          <ol>
            <li>在游戏选项中关闭「全屏模式」改用窗口化，或反之尝试。</li>
            <li>降低「缩放级别」到 75% 或 50%，减少渲染压力。</li>
            <li>关闭「显示水坑」「显示天气效果」等视觉选项。</li>
            <li>电脑如果有核显和独显，确保游戏使用独显运行（NVIDIA 控制面板 → 管理 3D 设置）。</li>
            <li>MOD 装太多也会卡顿，尝试移除不必要的 MOD。</li>
          </ol>
        </div>
      </div>
    </div>

    <div class="bug-item">
      <div class="bug-question" onclick="toggleBug(this)">
        <h3>安装 MOD 后游戏闪退</h3>
        <span class="bug-severity severity-high">严重</span>
        <span class="bug-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="bug-answer">
        <div class="bug-answer-inner">
          <p><span class="fix-label">原因：</span>SMAPI 版本不兼容、MOD 之间冲突、MOD 未更新到对应游戏版本。</p>
          <p><span class="fix-label">解决方法：</span></p>
          <ol>
            <li>确保安装了最新版 SMAPI，且 SMAPI 版本支持当前游戏版本。</li>
            <li>逐个移除 MOD 排查冲突，每次只加一个 MOD 测试。</li>
            <li>查看 SMAPI 控制台的红色错误信息，通常会指出是哪个 MOD 出了问题。</li>
            <li>在 Nexus Mods 上检查每个 MOD 的更新日期和兼容版本。</li>
            <li>使用 SMAPI 的 <code>trace</code> 命令获取详细错误日志。</li>
          </ol>
        </div>
      </div>
    </div>

    <div class="bug-item">
      <div class="bug-question" onclick="toggleBug(this)">
        <h3>多人联机无法加入或频繁掉线</h3>
        <span class="bug-severity severity-mid">中等</span>
        <span class="bug-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="bug-answer">
        <div class="bug-answer-inner">
          <p><span class="fix-label">解决方法：</span></p>
          <ol>
            <li>房主和玩家的游戏版本必须完全一致，包括 MOD 版本。</li>
            <li>通过 Steam 好友邀请联机最稳定，尽量不用 IP 直连。</li>
            <li>房主确保网络稳定，关闭 VPN 和代理。</li>
            <li>如果一直「正在连接」，让房主在游戏设置中关闭「启用多人游戏」再重新打开。</li>
            <li>联机时不要安装会修改游戏核心机制的 MOD，容易导致不同步。</li>
          </ol>
        </div>
      </div>
    </div>

    <div class="bug-item">
      <div class="bug-question" onclick="toggleBug(this)">
        <h3>作物/物品消失或变成错误物品</h3>
        <span class="bug-severity severity-mid">中等</span>
        <span class="bug-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="bug-answer">
        <div class="bug-answer-inner">
          <p><span class="fix-label">原因：</span>通常是 MOD 修改了物品 ID，或游戏版本更新后旧存档的物品数据不匹配。</p>
          <p><span class="fix-label">解决方法：</span></p>
          <ol>
            <li>如果装了 MOD，先移除所有 MOD 再加载存档，确认是否为 MOD 导致。</li>
            <li>不要在不同版本之间来回切换存档，高版本存档在低版本游戏中可能出问题。</li>
            <li>使用存档编辑器（如 Stardew Save Editor）检查并修复异常物品数据。</li>
            <li>如果是季节切换时作物消失，检查是否跨季节种植（非温室作物换季会枯萎）。</li>
          </ol>
        </div>
      </div>
    </div>

    <div class="bug-item">
      <div class="bug-question" onclick="toggleBug(this)">
        <h3>游戏没有声音或音效异常</h3>
        <span class="bug-severity severity-low">轻微</span>
        <span class="bug-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="bug-answer">
        <div class="bug-answer-inner">
          <p><span class="fix-label">解决方法：</span></p>

<script>
// 季节筛选
const filterBtns = document.querySelectorAll('.filter-btn');
const cropRows = document.querySelectorAll('#crop-tbody tr');

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active', 'spring', 'summer', 'fall', 'winter'));
    btn.classList.add('active');
    const season = btn.dataset.season;
    if (season !== 'all') btn.classList.add(season);

    cropRows.forEach(row => {
      if (season === 'all' || row.dataset.season === season) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  });
});

// Bug 折叠展开
function toggleBug(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
}

// 自查清单勾选
function toggleCheck(el) {
  el.classList.toggle('checked');
  saveChecklist();
}
function saveChecklist() {
  const items = document.querySelectorAll('.checklist-item');
  const states = [];
  items.forEach(item => states.push(item.classList.contains('checked')));
  localStorage.setItem('stardew-checklist', JSON.stringify(states));
}
function loadChecklist() {
  const saved = localStorage.getItem('stardew-checklist');
  if (!saved) return;
  const states = JSON.parse(saved);
  const items = document.querySelectorAll('.checklist-item');
  items.forEach((item, i) => {
    if (states[i]) item.classList.add('checked');
  });
}
loadChecklist();

// 导航高亮
const sections = document.querySelectorAll('.section');
const navLinks = document.querySelectorAll('.nav-links a');

window.addEventListener('scroll', () => {
  let current = '';
  sections.forEach(section => {
    const sectionTop = section.offsetTop - 100;
    if (window.scrollY >= sectionTop) {
      current = section.getAttribute('id');
    }
  });
  navLinks.forEach(link => {
    link.classList.remove('active');
    if (link.getAttribute('href') === '#' + current) {
      link.classList.add('active');
    }
  });

  // 回到顶部按钮
  const backTop = document.getElementById('backTop');
  if (window.scrollY > 400) {
    backTop.classList.add('show');
  } else {
    backTop.classList.remove('show');
  }
});
<\/script>

@media(max-width:640px){.boss-b .row{grid-template-columns:1fr;}}
.boss-b .stat{background:var(--bg2);border-radius:9px;padding:12px 14px;}
.boss-b .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.boss-b .stat .v{font-size:14.5px;color:#fff;margin-top:3px;}

/* ===== 进度清单 ===== */
.check{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:background .15s;}
.check:hover{background:var(--panel2);}
.check input{width:19px;height:19px;margin-top:3px;accent-color:var(--gold);flex:none;cursor:pointer;}
.check .lbl{flex:1;font-size:15px;}
.check .grp{font-size:12px;color:var(--gold);font-weight:700;display:block;margin-bottom:2px;letter-spacing:.5px;}
.check.done .lbl{color:var(--muted);text-decoration:line-through;}
#progbar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:16px 0 22px;}
#progbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));transition:width .3s;}

/* ===== 折叠 FAQ ===== */
.faq{margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.faq-q{padding:14px 16px;font-weight:700;color:#fff;cursor:pointer;display:flex;gap:10px;align-items:center;}
.faq-q .q{color:var(--red-soft);font-family:var(--mono);font-weight:800;}
.faq-q .chev{margin-left:auto;color:var(--muted);transition:transform .2s;}
.faq.open .faq-q .chev{transform:rotate(180deg);}
.faq-a{display:none;padding:0 16px 16px;color:var(--muted);font-size:14.5px;border-top:1px solid var(--line);padding-top:12px;}
.faq.open .faq-a{display:block;}

/* ===== 底部 ===== */
footer{padding:40px 0 60px;color:var(--muted);text-align:center;font-size:14px;}
#top{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--gold-soft);font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:80;}
#top:hover{background:var(--line);}

ul.li{list-style:none;}
ul.li li{padding-left:22px;position:relative;margin-bottom:7px;color:var(--text);font-size:15px;}
ul.li li::before{content:"";position:absolute;left:4px;top:11px;width:7px;height:7px;border-radius:2px;background:var(--gold);transform:rotate(45deg);}
ul.li li .m{color:var(--muted);}
</style>
</head>

    <div class="tag">· Terraria · 全流程 · 新手到毕业 ·</div>
    <h1>泰拉瑞亚 <span class="g">全流程</span> 深度攻略</h1>
    <p class="sub">从第一天踏入世界，到击败月球领主。按阶段推进的完整路线、全 BOSS 打法、装备与矿物图鉴、NPC 入住、建筑要点与常见问题排查，一页全收。</p>

  <div class="wrap">

      <h2><span class="n">00</span> 全流程进度清单</h2>

<section id="start">
  <div class="wrap">
    <div class="s-head">
      <div class="kicker">Getting Started</div>
      <h2><span class="n">01</span> 新手入门：从第一天开始</h2>
      <p>泰拉瑞亚不是单纯的挖矿游戏——它是挖矿、战斗、建造、探索、Boss 挑战五位一体的沙盒冒险。先弄懂三件事：这游戏要干嘛、有哪些难度与职业、第一天到底该干什么。</p>
    </div>

    <div class="grid g4" style="margin-bottom:18px;">
      <div class="card"><div class="big">2D</div><h3>游戏定位</h3><p>横版 2D 沙盒，地图无限，地下深处隐藏着全部主线和 Boss。</p></div>
      <div class="card"><div class="big">8+</div><h3>大 Boss 数量</h3><p>主线 Boss 十余个，另有事件 Boss 与可选 Boss。</p></div>
      <div class="card"><div class="big">3</div><h3>世界难度</h3><p>经典 / 专家 / 大师，影响敌人强度与掉落。</p></div>
      <div class="card"><div class="big">4</div><h3>主流职业</h3><p>近战 / 远程 / 法师 / 召唤，决定你的配装方向。</p></div>
    </div>

    <h3 style="color:var(--gold-soft);font-size:19px;margin:24px 0 10px;">一、建号与难度选择</h3>
    <div class="grid g2">
      <div class="card">
        <h3>角色难度（软核/中核/硬核）</h3>
        <ul class="li">
          <li><b>软核（推荐新手）</b>：死亡只掉钱，不掉装备。最宽容，适合第一次玩。<span class="m">—— 新手首选</span></li>
          <li><b>中核</b>：死亡会掉落身上所有物品，需要跑尸捡回。</li>
          <li><b>硬核</b>：死亡即永久删除角色，极难，不建议首次游玩。</li>
        </ul>
      </div>
      <div class="card">
        <h3>世界难度（创建世界时选）</h3>
        <ul class="li">
          <li><b>经典</b>：标准难度，默认体验。</li>
          <li><b>专家</b>：敌人更强、血量更高，Boss 掉落专属专家饰品。<span class="m">—— 老手向</span></li>
          <li><b>大师</b>：最强难度，敌人极强，额外宠物与专属坐骑掉落。</li>
        </ul>
        <div class="box warn" style="margin-top:12px;"><div class="bt">注意</div>首次游玩强烈建议：<b>软核角色 + 经典世界</b>。先熟悉流程，以后再挑战更高难度。</div>
      </div>
    </div>

    <h3 style="color:var(--gold-soft);font-size:19px;margin:24px 0 10px;">二、职业怎么选</h3>
    <div class="grid g4">
      <div class="card"><h3>近战 Melee</h3><p>高防高血，剑与近身武器。前期容错最高，推荐新手。<span class="m">代表：永夜刃、泰拉刃</span></p></div>
      <div class="card"><h3>远程 Ranged</h3><p>弓、枪、发射器。拉开距离输出，需备弹药。<span class="m">代表：熔火之怒、圣诞机关枪</span></p></div>
      <div class="card"><h3>法师 Mage</h3><p>魔法武器消耗法力值，DPS 高但需回蓝。<span class="m">代表：宝石法杖、幽灵法杖</span></p></div>
      <div class="card"><h3>召唤 Summoner</h3><p>召唤宠物替你打，本体躲闪走位。<span class="m">代表：史莱姆法杖、星辰龙</span></p></div>
    </div>
    <div class="box tip"><div class="bt">建议</div>新手不必死磕单一职业。前期资源少，哪个武器顺手用哪个；中期开始有了流派饰品，再专精一个方向。</div>

    <h3 style="color:var(--gold-soft);font-size:19px;margin:24px 0 10px;">三、第一天该干什么（10 步开局）</h3>
    <div class="box ok"><div class="bt">第一步：先活下来</div>白天先砍树（用斧头砍树干），搜集约 40-60 个木头。夜晚 7 点后僵尸和恶魔眼会出现，没有房子会死。</div>
    <div class="grid g2">
      <div class="card">
        <h3>白天 · 打基础</h3>
        <ul class="li">
          <li><b>1. 砍树</b>：攒木头，这是所有建筑和工具的基础。</li>
          <li><b>2. 做工作台</b>：10 个木头合成，所有手工合成都靠它。</li>
          <li><b>3. 做武器</b>：工作台做木剑，初期防身。</li>
          <li><b>4. 造房屋</b>：建一间能住的小屋（见「建筑基地」章）。</li>
          <li><b>5. 找向导</b>：出生点附近有向导 NPC，他会告诉你配方和 Boss 召唤方式，多和他对话。</li>
        </ul>
      </div>
      <div class="card">
        <h3>夜晚 · 稳局面</h3>
        <ul class="li">
          <li><b>6. 躲屋里</b>：关上门，夜晚怪物在屋外，别出去硬刚。</li>
          <li><b>7. 做火把</b>：木头+凝胶（史莱姆掉落）合成，照亮室内。</li>
          <li><b>8. 搭熔炉</b>：先采矿，再用石头+木头做熔炉，能烧矿石。</li>
          <li><b>9. 做铁砧</b>：有了铁/铅锭后做铁砧，能合成高级工具。</li>
          <li><b>10. 规划</b>：第二天去挖矿、去海边找渔夫、去地表收集资源。</li>
        </ul>
      </div>
    </div>
    <div class="box danger"><div class="bt">新手最大误区</div>不要一开始就盲目往地下猛挖。<b>先把地面基地建好、把工具升级到铁/金级</b>，再深入地下。越深怪物越强，前期送死只会掉钱。</div>
  </div>
</section>

<section id="road">
  <div class="wrap">
    <div class="s-head">
      <div class="kicker">Roadmap</div>
      <h2><span class="n">02</span> 全流程推进时间轴</h2>
      <p>泰拉瑞亚以「血肉墙」为分界：击败它之前是<b>肉山前（Pre-Hardmode）</b>，之后进入<b>困难模式（Hardmode）</b>。下面按主线顺序列出每一阶段的该做的事与里程碑。</p>
    </div>

    <h3 style="color:var(--teal-soft);font-size:19px;margin-bottom:6px;">阶段一 · 肉山前（新手到第一个大 Boss）</h3>
    <div class="timeline">
      <div class="tl-row"><div class="tl-time">第 1 天</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>建家 + 基础工具</h4><div class="desc">砍树建小屋、工作台、木剑，安置向导。目标：活过第一夜。</div></div></div>
      <div class="tl-row"><div class="tl-time">第 2-4 天</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>挖矿升级</h4><div class="desc">采铜/锡、铁/铅、银/钨、金/铂金矿，依次升级镐、斧、剑。做熔炉、铁砧。</div></div></div>
      <div class="tl-row"><div class="tl-time">前期 Boss</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>克苏鲁之眼（首个 Boss）</h4><div class="desc">夜晚用「可疑眼球」召唤，或收集晶状体自动触发。掉落材料做暗影/猩红装备。</div></div></div>
      <div class="tl-row"><div class="tl-time">中期</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>下矿洞 + 猩红/腐化之地</h4><div class="desc">前往地下猩红（红）或腐化（紫）之地，打克苏鲁之脑 / 世界吞噬者，获取暗影鳞片做更优装备。</div></div></div>
      <div class="tl-row"><div class="tl-time">中期 Boss</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>蜂后 → 骷髅王</h4><div class="desc">在丛林召唤蜂后拿蜜蜂装备；夜晚去地牢入口找老人对话召唤骷髅王，通关后进地牢拿黄金宝箱与哥布林工匠。</div></div></div>
      <div class="tl-row"><div class="tl-time">肉山前巅峰</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>地狱 · 熔岩装备</h4><div class="desc">挖到地狱，采集狱石（陨铁），做成熔岩镐、熔岩套与暗影/熔岩武器，这是肉山前最强装备。</div></div></div>
      <div class="tl-row"><div class="tl-time">转折点</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>击败血肉墙 → 进入困难模式</h4><div class="desc">把「向导巫毒娃娃」扔进地狱的岩浆（或用巫毒恶魔掉落），击败血肉墙后世界永久改变。</div></div></div>
    </div>

    <h3 style="color:var(--teal-soft);font-size:19px;margin:34px 0 6px;">阶段二 · 困难模式（游戏真正开始）</h3>
    <div class="box danger" style="margin-top:8px;"><div class="bt">重要转折</div>击败血肉墙后，世界会发生这些变化，务必提前准备：<br>① 世界被硬核模式污染，猩红/腐化会快速蔓延，三神之柱和更高阶怪物出现；<br>② 出现新三矿（钴蓝/钯金 → 秘银/山铜 → 精金/钛金），需要用「神锤」敲碎恶魔/猩红祭坛才能解锁；<br>③ 原武器基本作废，必须重新做装备；<br>④ 出现新的 NPC、事件与更多玩法。</div>
    <div class="timeline">
      <div class="tl-row"><div class="tl-time">困难起步</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>敲祭坛 + 挖新三矿</h4><div class="desc">用血肉墙掉落的神锤敲祭坛，解锁钴蓝/钯金、秘银/山铜、精金/钛金，逐级升级工具与装备。</div></div></div>
      <div class="tl-row"><div class="tl-time">三机械 Boss</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>毁灭者 → 双子魔眼 → 机械骷髅王</h4><div class="desc">用机械碎片在夜晚召唤。依次击败后获得神圣锭，做神圣装备，并解锁后续。</div></div></div>
      <div class="tl-row"><div class="tl-time">中期 Boss</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>世纪之花（丛林之花）</h4><div class="desc">击败三机械后，丛林深处会长出花苞，击碎召唤世纪之花。掉神圣锭，是困难模式关键转折。</div></div></div>
      <div class="tl-row"><div class="tl-time">后期</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>石巨人（丛林神庙）</h4><div class="desc">用丛林神庙的电池在神庙祭坛召唤石巨人，掉落最强材料之一。</div></div></div>
      <div class="tl-row"><div class="tl-time">可选 Boss</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>猪龙鱼公爵</h4><div class="desc">在海洋用「松露虫」钓鱼召唤，掉强力武器，是毕业前的重要战力补充。</div></div></div>
      <div class="tl-row"><div class="tl-time">毕业前</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>拜月教邪教徒 → 天界柱</h4><div class="desc">击败地牢顶部的邪教徒后，触发月亮事件，出现四根天界柱（日耀/星云/星尘/漩涡），逐一击破。</div></div></div>
      <div class="tl-row"><div class="tl-time">最终 Boss</div><div class="tl-dot"><span class="c"></span></div><div class="tl-body"><h4>月球领主（最终 Boss）</h4><div class="desc">击败四柱后，月球领主降临，这是游戏最终挑战。击败后通关，可用信标随时再挑战。</div></div></div>
    </div>
  </div>
</section>

<section id="boss">
  <div class="wrap">
    <div class="s-head">
      <div class="kicker">Boss Guide</div>
      <h2><span class="n">03</span> 全 BOSS 攻略（点击展开）</h2>
      <p>按主线推进顺序排列。每个 Boss 都给出：召唤方式、推荐装备与场地、核心打法、注意事项、主要掉落。点击卡片展开查看。</p>
    </div>

    <!-- ===== 肉山前 Boss ===== -->
    <h3 style="color:var(--teal-soft);font-size:19px;margin:10px 0 16px;">肉山前 Boss</h3>

    <div class="boss">
      <div class="boss-h">
        <div class="ico" style="background:rgba(224,98,74,.15);color:var(--red-soft);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.2" fill="currentColor"/><circle cx="15" cy="10" r="1.2" fill="currentColor"/></svg>
        </div>
        <div class="tt"><h4>克苏鲁之眼 <span class="ph">Eye of Cthulhu · 夜晚 Boss</span></h4></div>
        <div class="chev">▾</div>
      </div>
      <div class="boss-b">
        <p>新手的第一个大 Boss，主要用来熟悉战斗节奏。</p>
        <div class="row">
          <div class="stat"><div class="k">召唤方式</div><div class="v">夜晚使用「可疑眼球」（6 个晶状体+6 个木头在恶魔祭坛合成）；或新角色游戏初期会自然触发一次。</div></div>
          <div class="stat"><div class="k">推荐装备</div><div class="v">铁/银/金套 + 熔岩/金剑，至少 30 个治疗药水，平坦开阔战斗场地。</div></div>
          <div class="stat"><div class="k">核心打法</div><div class="v">冲撞时横向跑位躲避；半血后进入第二形态会加速并冲刺，保持距离、跳跃躲避。</div></div>
          <div class="stat"><div class="k">注意</div><div class="v">只能夜晚存在，天亮没打完它会狂暴飞走；半血后冲刺变快，别贪刀。</div></div>
        </div>
        <div class="box ok"><div class="bt">主要掉落</div>恶魔/猩红矿、暗影/猩红鳞片、克苏鲁面具。材料用于做暗影套/猩红套。</div>
      </div>
    </div>

    <div class="boss">
      <div class="boss-h">
        <div class="ico" style="background:rgba(178,141,255,.15);color:var(--purple);">

<section id="build">
  <div class="wrap">
    <div class="s-head">
      <div class="kicker">Building</div>
      <h2><span class="n">06</span> 建筑与基地建设</h2>
      <p>基地是你所有活动的枢纽。一间合格的 NPC 房屋、合理的布局能大幅提升游戏体验。</p>
    </div>

    <div class="grid g2">
      <div class="card">
        <h3>NPC 合格房屋标准</h3>
        <ul class="li">
          <li><b>尺寸</b>：内部至少 <b>10×6</b> 格（宽×高），建议更大。</li>
          <li><b>墙壁</b>：必须用墙填充，不能全是背景墙或空白。</li>
          <li><b>桌椅</b>：至少 1 张桌子和 1 把椅子。</li>
          <li><b>光源</b>：至少 1 个光源（火把、吊灯等）。</li>
          <li><b>入口</b>：至少 1 个门或平台入口。</li>
          <li><b>地板</b>：有完整地板，不能是虚空。</li>
        </ul>
        <div class="box warn"><div class="bt">常见不合格原因</div>房间太小 / 缺桌椅 / 缺光源 / 没装墙 / 有背景墙但没封顶。用「房屋查询器」一键检测。</div>
      </div>
      <div class="card">
        <h3>基地布局建议</h3>
        <ul class="li">
          <li><b>核心区</b>：工作台、熔炉、铁砧、仓库箱集中放置，方便合成。</li>
          <li><b>储物区</b>：用箱子分类（矿物、材料、药水、装饰），命名清楚。</li>
          <li><b>NPC 区</b>：给每个 NPC 一间独立房，最好相邻便于购买。</li>
          <li><b>床</b>：放置床并设为出生点，死亡或睡觉能快速回基地。</li>
          <li><b>庇护所</b>：关键区域修墙封顶，防止夜晚怪物偷袭。</li>
        </ul>
      </div>
    </div>

    <h3 style="color:var(--gold-soft);font-size:19px;margin:24px 0 12px;">Boss 战斗场地搭建</h3>
    <div class="grid g3">
      <div class="card"><h3>平台跑道</h3><p>用平台搭建多层水平跑道，用于风筝 Boss（尤其血肉墙前必须铺长跑道）。</p></div>
      <div class="card"><h3>开阔广场</h3><p>清空一片平地，铺上火把，用于近战/远程 Boss 战斗，避免地形卡位。</p></div>
      <div class="card"><h3>药水补给点</h3><p>战斗场旁放箱子装满治疗药水、增益药水，打不过随时回血补药。</p></div>
    </div>
  </div>
</section>

      <h2><span class="n">08</span> 常见问题与故障排查</h2>
      <p>新手最常遇到的问题，点击展开查看解决办法。</p>
    </div>

    <div class="faq"><div class="faq-q"><span class="q">Q1</span>打不过某个 Boss，怎么办？<span class="chev">▾</span></div><div class="faq-a">① 检查装备：是否达到该 Boss 对应的套装/武器等级；② 是否备足治疗药水与增益药水；③ 是否搭建了合适的战斗场地；④ 是否了解该 Boss 的攻击模式。按「全 Boss 攻略」章节逐一排查即可。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q2</span>为什么 NPC 不入住？<span class="chev">▾</span></div><div class="faq-a">先确认：① 有空房（用房屋查询器检查是否合格）；② 满足该 NPC 的入住条件（见「NPC 入住条件」表）；③ 稍等片刻。常见错误是房间缺桌椅、光源或墙。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q3</span>腐化/猩红蔓延得越来越快，基地会不会被吞？<span class="chev">▾</span></div><div class="faq-a">会。困难模式后蔓延加快。应对：① 用防腐喷雾（蒸汽朋克人出售）清理；② 在基地周围留出隔离带（挖坑或用不可腐化物填充）；③ 及时清理蔓延源。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q4</span>机械 Boss 怎么召唤？<span class="chev">▾</span></div><div class="faq-a">击败血肉墙进入困难模式后，夜晚用「机械蠕虫」（毁灭者）、「机械眼球」（双子魔眼）、「机械骷髅头」（机械骷髅王）召唤。这些道具用机械碎片在铁砧合成。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q5</span>世纪之花召唤不出来？<span class="chev">▾</span></div><div class="faq-a">必须先击败三机械 Boss。之后在丛林地下层寻找随机生成的「花苞」，用镐打碎花苞即可召唤。若找不到，多在丛林深处探索。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q6</span>游戏卡顿/掉帧，怎么优化？<span class="chev">▾</span></div><div class="faq-a">① 游戏设置里降低画面分辨率与粒子效果；② 关闭光影/背景特效；③ 减少画面内过多火把或方块粒子；④ 更新显卡驱动；⑤ 关闭后台占用软件。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q7</span>角色死了，装备会丢吗？<span class="chev">▾</span></div><div class="faq-a">软核角色死亡只掉金币，装备保留；中核会掉落全部身上物品，需要跑尸捡回；硬核死亡角色永久删除。看你的角色难度设置。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q8</span>怎么快速赚钱？<span class="chev">▾</span></div><div class="faq-a">前期：钓鱼卖鱼、挖矿卖矿、打史莱姆。中期：击败 Boss 掉材料卖钱。后期：制作并出售高级药剂、刷南瓜月/霜月。也可以炼药出售。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q9</span>抓钩怎么用/怎么获得？<span class="chev">▾</span></div><div class="faq-a">抓钩（Grappling Hook）可从史莱姆王、史莱姆雨或地牢宝箱获得。装备后按右键/指定键发射钩爪，可钩住方块移动。搭配「滑翔翼」机动性更强。</div></div>
    <div class="faq"><div class="faq-q"><span class="q">Q10</span>游戏有修改器/作弊吗？<span class="chev">▾</span></div><div class="faq-a">官方支持「旅程模式」（Journey Mode），可自由调整难度、复制物品、改变时间，是最正规的作弊手段，适合想轻松体验的玩家。不建议使用第三方外挂，有封号风险。</div></div>

<script>

function showHome(){
  home.style.display='flex';
  game.style.display='none';
  frame.removeAttribute('srcdoc');
  setNav(null);
  window.scrollTo(0,0);
}
function showGame(name){
  var src = name==='stardew' ? srcStardew : srcTerraria;
  frame.srcdoc = src;
  home.style.display='none';
  game.style.display='block';
  setNav(name);
  window.scrollTo(0,0);
}
function setNav(active){
  nav.querySelectorAll('a').forEach(function(a){
    a.classList.toggle('on', a.getAttribute('data-view')===active);
  });
}
nav.addEventListener('click', function(e){
  var t = e.target.closest('a'); if(!t) return;
  var v = t.getAttribute('data-view');
  if(v==='home') showHome(); else showGame(v);
});
document.querySelectorAll('#view-home .card').forEach(function(c){
  c.addEventListener('click', function(){ showGame(c.getAttribute('data-view')); });
});
showHome();
